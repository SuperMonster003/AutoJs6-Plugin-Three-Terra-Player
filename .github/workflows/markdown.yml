name: Documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  markdown:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: .python/check_markdown.bat
        shell: cmd
