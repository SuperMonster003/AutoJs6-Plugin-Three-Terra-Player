name: Icon geometry
on:
  push:
    paths: ['.python/**', 'app/src/main/res/**', '.github/workflows/icons.yml']
  pull_request:
    paths: ['.python/**', 'app/src/main/res/**', '.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: python .python/generate_launcher_icons.py --check
      - run: python -m unittest discover -s .python/tests -p test_icon_geometry.py
